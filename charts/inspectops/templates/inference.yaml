{{- $name := printf "%s-inference" (include "inspectops.fullname" .) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "inspectops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: inference
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "inspectops.labels" . | nindent 4 }}
spec:
  {{- if not .Values.inference.hpa.enabled }}
  replicas: {{ .Values.inference.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: inference
          image: {{ .Values.inference.image }}
          imagePullPolicy: {{ .Values.inference.pullPolicy }}
          env:
            - name: WORKERS
              value: {{ .Values.inference.workers | quote }}
            - name: EXTRA_LATENCY_MS
              value: {{ .Values.inference.extraLatencyMs | quote }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.inference.resources | nindent 12 }}
{{- if .Values.inference.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "inspectops.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.inference.hpa.minReplicas }}
  maxReplicas: {{ .Values.inference.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.inference.hpa.cpuUtilization }}
{{- end }}
