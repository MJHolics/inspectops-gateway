services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspectops
      POSTGRES_USER: inspectops
      POSTGRES_PASSWORD: inspectops
    # 호스트 포트는 열지 않는다(5432는 Langfuse 스택이 쓰고 있다). gateway만 내부 네트워크로 접근.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspectops"]
      interval: 2s
      retries: 30

  inference:
    build: ./inference-service
    environment:
      EXTRA_LATENCY_MS: ${EXTRA_LATENCY_MS:-0}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      retries: 30

  gateway:
    build: ./gateway
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inspectops
      INFERENCE_URL: http://inference:8000
      VIRTUAL_THREADS: ${VIRTUAL_THREADS:-false}
      OPEN_IN_VIEW: ${OPEN_IN_VIEW:-false}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      inference: {condition: service_healthy}
